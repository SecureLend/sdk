name: Test Coverage

on:
  push:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build SDK and React packages
        run: npm run build -w @securelend/sdk && npm run build -w @securelend/react

      - name: Check SDK route contract
        run: node packages/sdk/scripts/check-contract.mjs

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Generate coverage badge
        run: npm run coverage:badge

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shields/coverage-badge.svg
          if ! git diff --cached --quiet; then
            git commit -m "docs: Update test coverage badge"
            git push
          else
            echo "No changes to commit"
          fi
