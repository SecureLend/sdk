[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "securelend"
version = "0.1.0b5"
description = "SecureLend SDK for Python"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0"
]

[project.urls]
"Homepage" = "https://github.com/SecureLend/sdk/tree/main/packages/python"
"Bug Tracker" = "https://github.com/SecureLend/sdk/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-asyncio>=0.20"
]
